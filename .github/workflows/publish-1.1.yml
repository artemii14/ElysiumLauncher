name: Publish Elysium Launcher 1.1
on:
  push:
    branches: [arena/1bdea8a4-ubiquitous-happiness]
    paths: [.github/workflows/publish-1.1.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-release-1-1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CODE_SHA: eaa465a7406ef51429d20b6026e546a6cf144083
      TAG: v1.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful runs and application source
        run: |
          set -euo pipefail
          for run in 43885411853 43885411902; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha)" = "$CODE_SHA"
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .conclusion)" = success
          done
          git diff --exit-code "$CODE_SHA" HEAD -- launcher libraries buildconfig program_info cmake CMakeLists.txt tests
      - uses: actions/download-artifact@v4
        with:
          name: ElysiumLauncher-Windows-x64-portable
          run-id: 43885411853
          github-token: ${{ github.token }}
          path: payload/windows
      - uses: actions/download-artifact@v4
        with:
          name: ElysiumLauncher-Linux-x86_64-AppImage
          run-id: 43885411902
          github-token: ${{ github.token }}
          path: payload/linux
      - name: Verify and package files
        run: |
          set -euo pipefail
          test -f payload/windows/elysiumlauncher.exe
          test -f payload/windows/platforms/qwindows.dll
          test -f payload/windows/portable.txt
          test -f payload/windows/jars/NewLaunch.jar
          (cd payload/linux && sha256sum -c ElysiumLauncher-Linux-x86_64.AppImage.sha256)
          mkdir release
          (cd payload/windows && zip -q -r ../../release/ElysiumLauncher-1.1-Windows-x64-portable.zip .)
          cp payload/linux/ElysiumLauncher-Linux-x86_64.AppImage release/ElysiumLauncher-1.1-Linux-x86_64.AppImage
          (cd release && sha256sum ElysiumLauncher-1.1-Windows-x64-portable.zip ElysiumLauncher-1.1-Linux-x86_64.AppImage > SHA256SUMS.txt)
      - name: Upload assets before publishing
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --target "$CODE_SHA" --draft --title "Elysium Launcher 1.1" --notes-file docs/RELEASE-v1.1.md
          fi
          gh release upload "$TAG" release/ElysiumLauncher-1.1-Windows-x64-portable.zip release/ElysiumLauncher-1.1-Linux-x86_64.AppImage release/SHA256SUMS.txt --clobber
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" = 3
          gh release edit "$TAG" --notes-file docs/RELEASE-v1.1.md --draft=false --prerelease=false --latest
          gh release view "$TAG" --json url,assets
