name: Windows symlink diagnostics
on:
  push:
    paths:
      - .github/workflows/diagnostics.yml
permissions:
  actions: read
  contents: read
jobs:
  symlink-error:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/artemii14/ubiquitous-happiness/actions/jobs/132243246707/logs > previous.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('previous.log').read_text().splitlines()
          selected = [l for l in lines if any(t in l for t in ('Failed to link', 'Error code:', 'privileged link', 'Privileged run', 'Running: runas', 'Link Failed', 'Link failure', 'results received'))]
          text = '\n'.join(selected[:16])[:3000]
          print('::notice title=Symlink failure::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
