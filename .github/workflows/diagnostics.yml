name: Read Windows test failure
on:
  push:
    paths:
      - .github/workflows/diagnostics.yml
permissions:
  actions: read
  contents: read
jobs:
  previous-error:
    runs-on: ubuntu-24.04
    steps:
      - name: Extract failing test details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/artemii14/ubiquitous-happiness/actions/jobs/132230697062/logs > previous.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = re.sub(r'\x1b\[[0-9;]*m', '', Path('previous.log').read_text()).splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if any(token in line for token in ('FAIL!', 'Actual ', 'Expected ', 'Loc:', 'CMake Error', 'error:')):
                  selected.update(range(max(0, i-1), min(len(lines), i+5)))
          detail = '\n'.join(lines[i] for i in sorted(selected))[-3000:]
          if not detail: detail = '\n'.join(lines[-25:])[-3000:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Windows test failure::' + detail)
          PY
