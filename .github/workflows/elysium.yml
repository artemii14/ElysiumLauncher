name: ElysiumLauncher Linux build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elysium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check branding and resources
        run: python3 scripts/check_elysium.py
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build extra-cmake-modules pkg-config scdoc \
            cmark libarchive-dev libcmark-dev libqrencode-dev zlib1g-dev libtomlplusplus-dev \
            gamemode-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: qtnetworkauth qtimageformats
          cache: true
      - name: Configure
        run: bash scripts/ci_run.sh cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENABLE_LTO=OFF -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
      - name: Build
        run: bash scripts/ci_run.sh cmake --build build --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/ci_run.sh ctest --test-dir build --output-on-failure
      - name: Install
        run: bash scripts/ci_run.sh cmake --install build
      - uses: actions/upload-artifact@v4
        with:
          name: ElysiumLauncher-Linux-development
          path: install/
          if-no-files-found: error
